<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>신정교 테니스코트 예약</title>
    <style>
        :root {
            --tennis-green: #dfff4f;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --visited-bg: #0f172a;
            --check-blue: #3b82f6;
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: linear-gradient(135deg, var(--bg-dark), #1e293b);
            color: white;
            display: flex; 
            justify-content: center; 
            padding: 20px 10px; 
            margin: 0;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; }

        h2 { 
            text-align: center; font-style: italic; font-weight: 900;
            letter-spacing: -1px; color: var(--tennis-green);
            margin-bottom: 5px; text-transform: uppercase;
        }

        .sub-title {
            text-align: center; font-size: 12px; color: #94a3b8;
            margin-bottom: 25px; letter-spacing: 1px;
        }
        
        .notice { 
            background: rgba(223, 255, 79, 0.1);
            border: 1px dashed var(--tennis-green);
            color: var(--tennis-green);
            text-align: center; font-size: 13px; padding: 12px; 
            border-radius: 12px; margin-bottom: 20px; font-weight: bold;
        }

        .input-card {
            background: var(--card-bg);
            padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        .row { display: flex; gap: 10px; margin-bottom: 12px; }
        
        input[type="date"], select { 
            background: #334155; border: 1px solid #475569;
            color: white; padding: 15px; border-radius: 12px; 
            font-size: 16px; text-align: center; width: 100%; outline: none;
            box-sizing: border-box;
        }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            background-color: var(--tennis-green);
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-btn { 
            width: 100%; padding: 18px; 
            background-color: var(--tennis-green); color: black; 
            border: none; border-radius: 12px; cursor: pointer; 
            font-weight: 900; font-size: 17px; transition: 0.2s;
        }
        .add-btn:active { transform: scale(0.96); }

        .check-my-btn {
            width: 100%; padding: 16px;
            background-color: var(--check-blue);
            color: white; border: none; border-radius: 12px;
            cursor: pointer; font-weight: bold; font-size: 16px;
            margin-top: 20px; margin-bottom: 30px;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        #urlList { list-style: none; padding: 0; margin: 0; }
        
        .url-item { 
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px; margin-bottom: 15px; border-radius: 16px; 
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: all 0.3s ease;
        }

        .url-item.visited {
            background: var(--visited-bg);
            border-color: var(--tennis-green);
            opacity: 0.7;
        }

        .url-item.visited .date-info::after {
            content: " ✓";
            color: var(--tennis-green);
        }
        
        .link-content { flex-grow: 1; }
        .court-name { display: block; font-size: 12px; color: var(--tennis-green); font-weight: bold; margin-bottom: 4px; }
        .date-info { font-size: 18px; font-weight: 700; color: white; }

        .delete-btn { 
            background: #ef4444; color: white; border: none; 
            width: 44px; height: 44px; border-radius: 10px; 
            cursor: pointer; font-size: 20px; margin-left: 15px;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>신정교 테니스코트 예약</h2>
    <div class="sub-title">신정교 테니스코트 예약 지름길 생성</div>
    
    <div class="notice">
        ⚡️ 반드시 양천구청 통합예약포털에 로그인 후 사용하세요!
    </div>
    
    <div class="input-card">
        <div class="row">
            <input type="date" id="targetDate">
        </div>
        <div class="row">
            <select id="court">
                <option value="RI001407">신정교 1코트</option>
                <option value="RI001517">신정교 2코트</option>
                <option value="RI001518">신정교 3코트</option>
            </select>
        </div>
        <button class="add-btn" onclick="addToList()">리스트에 추가하기</button>
    </div>

    <ul id="urlList"></ul>

    <button class="check-my-btn" onclick="window.open('https://www.yangcheon.go.kr/reservation/reservation/foffice/ex/reservationMy/list.do', '_blank', 'width=800,height=900,scrollbars=yes');">
        🔍 나의 예약 확인하기
    </button>
</div>

<script>
    const dateInput = document.getElementById('targetDate');
    const today = new Date();
    const offset = today.getTimezoneOffset() * 60000;
    const localDate = new Date(today.getTime() - offset).toISOString().split('T')[0];
    dateInput.value = localDate;

    const addedItems = new Set();

    function addToList() {
        const fullDate = dateInput.value; 
        if (!fullDate) {
            alert("날짜를 입력해주세요!");
            return;
        }

        const dateParts = fullDate.split('-');
        const year = dateParts[0];
        const month = parseInt(dateParts[1]);
        const day = parseInt(dateParts[2]);

        const courtSelect = document.getElementById('court');
        const riIdx = courtSelect.value;
        const courtName = courtSelect.options[courtSelect.selectedIndex].text;
        const urlList = document.getElementById('urlList');

        const itemKey = `${year}-${month}-${day}-${riIdx}`;

        if (addedItems.has(itemKey)) {
            alert("이미 리스트에 추가된 코트예요! 😊");
            return;
        }

        const url = `https://www.yangcheon.go.kr/reservation/reservation/foffice/ex/reservationCal/userForm.do?year=${year}&month=${month}&day=${day}&pageIndex=1&riIdx=${riIdx}&tab=R&timeweek=&restAt=`;

        const li = document.createElement('li');
        li.className = 'url-item';
        li.dataset.key = itemKey;
        
        li.innerHTML = `
            <div class="link-content" onclick="openAndMark(this, '${url}')">
                <span class="court-name">${courtName}</span>
                <span class="date-info">📅 ${year}년 ${month}월 ${day}일</span>
            </div>
            <button class="delete-btn" onclick="removeItem(this)">×</button>
        `;

        urlList.insertBefore(li, urlList.firstChild);
        addedItems.add(itemKey);
    }

    function removeItem(btn) {
        event.stopPropagation();
        const li = btn.parentElement;
        const key = li.dataset.key;
        addedItems.delete(key);
        li.remove();
    }

    function openAndMark(element, url) {
        window.open(url, '_blank', 'width=800,height=900,scrollbars=yes');
        element.parentElement.classList.add('visited');
    }
</script>

</body>
</html>
