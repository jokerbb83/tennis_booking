<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelloCourt — 코트 빈자리 현황</title>
<style>
  :root {
    --navy: #0C1D37; --navy2: #12294D; --line: #AED700;
    --white: #F4F6F0; --dim: #7C8AA0; --red: #E05252; --amber: #E0A852;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--navy); color: var(--white); min-height: 100vh;
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }
  body::before {
    content: ""; position: fixed; left: 20px; top: 0; bottom: 0; width: 2px;
    background: var(--line); opacity: .35;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 36px 20px 80px; }

  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  h1 em { font-style: normal; color: var(--line); }
  .meta { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .meta.stale { color: var(--amber); }
  .meta .dot::before {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; margin-right: 6px;
  }

  .hero { margin: 34px 0 38px; }
  .hero .eyebrow { font-size: 12px; letter-spacing: 2px; color: var(--dim); margin-bottom: 12px; }
  .hero .none { font-size: 30px; font-weight: 300; color: var(--dim); letter-spacing: -1px; }
  .vacancy {
    display: flex; align-items: baseline; gap: 12px; padding: 15px 0; flex-wrap: wrap;
    border-bottom: 1px solid rgba(174,215,0,.18); cursor: pointer; text-decoration: none;
  }
  .vacancy:hover .go { color: var(--line); }
  .vacancy .when { font-size: 24px; font-weight: 800; letter-spacing: -.5px; color: var(--line); font-variant-numeric: tabular-nums; }
  .vacancy .court { font-size: 15px; color: var(--white); }
  .vacancy .go { margin-left: auto; font-size: 13px; color: var(--dim); }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .court-card { background: var(--navy2); border-radius: 8px; padding: 13px 13px 11px; border: 1px solid transparent; }
  .court-card.hot { border-color: var(--line); }
  .court-card.fail { border-color: var(--red); }
  .court-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
  .court-card .st { font-size: 12px; color: var(--dim); }
  .court-card.hot .st { color: var(--line); }
  .court-card.fail .st { color: var(--red); }
  .court-card ul { list-style: none; margin-top: 7px; }
  .court-card li { font-size: 12px; color: var(--line); padding: 2px 0; font-variant-numeric: tabular-nums; }

  section h2 { font-size: 12px; letter-spacing: 2px; color: var(--dim); margin: 38px 0 12px; }

  .log { list-style: none; }
  .log li {
    display: flex; gap: 14px; padding: 8px 0; font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,.05); font-variant-numeric: tabular-nums;
  }
  .log .t { color: var(--dim); flex-shrink: 0; }
  .log .empty { color: var(--dim); border: none; }

  footer { margin-top: 56px; font-size: 12px; color: var(--dim); line-height: 1.7; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hello<em>Court</em></h1>
    <div class="meta" id="meta">불러오는 중…</div>
  </header>

  <div class="hero">
    <div class="eyebrow">지금 잡을 수 있는 빈자리</div>
    <div id="vacancies"><div class="none">불러오는 중…</div></div>
  </div>

  <section>
    <h2>코트 상태</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section>
    <h2>알림 기록</h2>
    <ul class="log" id="log"><li class="empty">빈자리가 발견되면 여기에 기록됩니다.</li></ul>
  </section>

  <footer>
    GitHub Actions가 약 5분 간격으로 자동 조회하며, 새 빈자리는 텔레그램으로 전송됩니다.<br>
    텔레그램 봇에게 <b>끄기</b> / <b>켜기</b> / <b>상태</b> 를 보내 감시를 제어할 수 있습니다 (반영까지 최대 5분).<br>
    항목을 누르면 <a href="https://sports.gangseo.seoul.kr/fmcs/28" target="_blank">강서구 예약 사이트</a>가 열립니다.
  </footer>
</div>

<script>
const RESERVE_URL = "https://sports.gangseo.seoul.kr/fmcs/28";

async function load() {
  let s;
  try {
    s = await (await fetch("status.json?ts=" + Date.now(), { cache: "no-store" })).json();
  } catch (e) {
    document.getElementById("meta").textContent =
      "status.json 없음 — Actions가 아직 한 번도 실행되지 않았습니다";
    return;
  }

  // 갱신 시각 + 온오프 + 오래됐으면 경고
  const meta = document.getElementById("meta");
  const updated = new Date(s.updated_at.replace(" ", "T") + "+09:00");
  const ageMin = Math.round((Date.now() - updated.getTime()) / 60000);
  const onoff = s.enabled === false
    ? `<span style="color:var(--dim)">감시 꺼짐 ⚪</span> · `
    : `<span style="color:var(--line)">감시 중 🟢</span> · `;
  meta.innerHTML = `${onoff}마지막 조회 ${s.updated_at} (${ageMin}분 전)`;
  meta.classList.toggle("stale", s.enabled !== false && ageMin > 20);
  if (s.enabled !== false && ageMin > 20) meta.innerHTML += " · 갱신 지연 중";

  // 빈자리 전체
  const all = [];
  for (const [name, c] of Object.entries(s.courts))
    for (const sl of c.slots) all.push({ name, ...sl });
  all.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  document.getElementById("vacancies").innerHTML = all.length
    ? all.map(x => `<a class="vacancy" href="${RESERVE_URL}" target="_blank">
        <span class="when">${x.label.split(" ")[1]}</span>
        <span class="court">${x.label.split(" ")[0]} · ${x.name} 코트</span>
        <span class="go">예약하러 가기 →</span></a>`).join("")
    : `<div class="none">현재 없음</div>`;

  // 코트 그리드
  document.getElementById("grid").innerHTML = Object.entries(s.courts).map(([name, c]) => {
    const cls = c.slots.length ? "hot" : (c.status !== "정상" ? "fail" : "");
    const st = c.status !== "정상" ? "조회 실패" :
               c.slots.length ? `빈자리 ${c.slots.length}건` : "빈자리 없음";
    const list = c.slots.slice(0, 4).map(sl => `<li>${sl.label}</li>`).join("");
    return `<div class="court-card ${cls}"><h3>${name}</h3><div class="st">${st}</div><ul>${list}</ul></div>`;
  }).join("");

  // 알림 기록
  if (s.alerts && s.alerts.length) {
    document.getElementById("log").innerHTML = s.alerts.map(a =>
      `<li><span class="t">${a.time}</span><span>${a.text}</span></li>`).join("");
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
