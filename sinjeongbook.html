<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>한미모스 테니스 클럽 관리</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { 
            --available: #e0e0e0; --booked: #ef9a9a; --primary: #2c3e50; 
            --holiday: #e53935; --anniversary-bg: #fff9c4; 
            --special-border: #ffd32a;
            --special-bg: #fffdf0;
            --summary-blue: #3498db;
        }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f4f4; padding: 20px; color: #333; }
        
        .header-container { text-align: center; margin-bottom: 20px; }
        .nav-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; }
        .nav-btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; }
        .current-month { font-size: 26px; font-weight: 800; color: #2c3e50; }
        
        .btn-group { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .btn-group:last-of-type { margin-bottom: 30px; }
        .action-btn { padding: 12px 18px; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 rgba(0,0,0,0.1); }
        .btn-cal { background-color: #ff5e57; } .btn-list { background-color: #ff9f43; } .btn-copy { background-color: #feca57; color: #574b1f; }
        .btn-excel { background-color: #1dd1a1; } .btn-save { background-color: #54a0ff; } .btn-load { background-color: #a29bfe; }
        .btn-clear { background-color: #ee5253; }

        #capture-calendar-area { background-color: #fff; padding: 25px; border-radius: 15px; max-width: 1400px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .calendar-title-bar { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; min-height: 60px; }
        .calendar-title-bar .title-center { text-align: center; }
        .calendar-title-bar .title-left { position: absolute; left: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 45%; }
        .calendar-title-bar .title-left-top { display: flex; align-items: center; gap: 8px; }
        .calendar-title-bar .title-right { display: none; }
        .name-filters { display: flex; flex-wrap: wrap; gap: 4px; }
        .filter-btn { padding: 4px 10px; border: 2px solid #54a0ff; background: #54a0ff; color: white; border-radius: 14px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.15s; line-height: 1; }
        .filter-btn.off { background: white; color: #999; border-color: #ccc; text-decoration: line-through; }
        .filter-btn:hover { transform: translateY(-1px); }
        .filter-btn .filter-count { font-size: 10px; opacity: 0.8; margin-left: 3px; font-weight: normal; }
        #quick-name { padding: 9px 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; width: 130px; text-align: center; font-weight: bold; }
        #quick-name:focus { outline: none; border-color: #54a0ff; }
        #quick-name.has-value { background: #fff3cd; border-color: #f39c12; color: #d35400; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-label { text-align: center; font-weight: bold; padding: 10px; background: #eee; border-radius: 5px; }
        
        .day-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px; min-height: 160px; position: relative; transition: all 0.2s; }
        .day-card.special-day { border: 4px solid var(--special-border) !important; background-color: var(--special-bg) !important; transform: scale(1.02); z-index: 1; }

        .date-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #f0f0f0; margin-bottom: 8px; padding-bottom: 4px; }
        .date-num { font-weight: bold; font-size: 14px; cursor: pointer; padding: 2px 5px; border-radius: 4px; }
        .date-num:hover { background: #eee; }
        .holiday-name { font-size: 11px; margin-left: 3px; font-weight: bold; }
        .anni-name { font-size: 11px; margin-left: 5px; background: var(--anniversary-bg); padding: 1px 4px; border-radius: 3px; color: #d35400; font-weight: bold; border: 1px solid #f39c12; }
        .sun { color: var(--holiday); } .sat { color: #1e88e5; }
        
        .edit-mode-btn { cursor: pointer; font-size: 14px; color: #999; border: none; background: none; }
        .court-row { display: flex; gap: 3px; margin-bottom: 4px; align-items: center; }
        .time-label { font-size: 10px; width: 35px; color: #999; font-weight: bold; }
        .court-btn { flex: 1; height: 24px; border: none; border-radius: 4px; background-color: var(--available); cursor: pointer; font-size: 11px; color: #999; font-weight: 500; }
        .court-btn.booked { background-color: var(--booked); color: #b71c1c; font-weight: bold; }

        .custom-container { display: flex; flex-direction: column; gap: 5px; }
        .custom-entry { padding: 6px; border-radius: 6px; font-size: 12px; text-align: center; color: white; cursor: pointer; font-weight: bold; }
        .custom-time-view { border-bottom: 1px solid rgba(255,255,255,0.3); margin-bottom: 2px; padding-bottom: 2px; }
        .custom-add-btn { width: 100%; padding: 4px; font-size: 11px; border: 1px dashed #bbb; background: #fafafa; cursor: pointer; border-radius: 4px; }

        .summary-capture-area { padding: 40px; background: #ffffff; width: 600px; }
        .summary-header { text-align: center; margin-bottom: 40px; }
        .summary-header h1 { font-size: 36px; color: #2c3e50; margin: 0; }
        .summary-header p { font-size: 20px; color: #666; margin-top: 5px; font-weight: bold; }
        .summary-card { background: #f8f9fa; border-radius: 15px; padding: 25px; margin-bottom: 25px; border-left: 10px solid var(--summary-blue); }
        .summary-date { font-size: 24px; font-weight: 800; color: #333; margin-bottom: 15px; }
        .summary-list { list-style: none; padding: 0; margin: 0; }
        .summary-item { font-size: 19px; color: #444; margin-bottom: 10px; display: flex; align-items: center; }
        .summary-item::before { content: "•"; margin-right: 12px; color: #888; font-size: 24px; }

        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: white; padding: 25px; border-radius: 15px; width: 340px; text-align: center; }
        .modal input { width: 90%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 10px; text-align: center; }
        .modal-buttons { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .m-btn { flex: 1 1 80px; padding: 12px 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; min-width: 80px; font-size: 14px; white-space: nowrap; }
        .m-save { background: #2196F3; } .m-delete { background: #f44336; } .m-cancel { background: #7f8c8d; }
        .m-merge { background: #27ae60; } .m-overwrite { background: #e67e22; }
        .m-keep { background: #7f8c8d; } .m-replace { background: #e67e22; }

        /* 중복 모달 */
        .conflict-modal { background: white; padding: 25px; border-radius: 15px; width: 480px; max-width: 92vw; max-height: 85vh; display: flex; flex-direction: column; }
        .conflict-modal h3 { margin: 0 0 10px 0; }
        .conflict-desc { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 12px; }
        .conflict-list { flex: 1; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 8px; margin-bottom: 12px; background: #fafafa; }
        .conflict-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; }
        .conflict-item:last-child { border-bottom: none; }
        .conflict-item-header { font-weight: bold; color: #2c3e50; margin-bottom: 4px; }
        .conflict-arrow { color: #999; margin: 0 6px; }
        .conflict-old { color: #c0392b; }
        .conflict-new { color: #27ae60; font-weight: bold; }

        /* 누적 불러오기 그룹별 색상 (booked 상태에 덮어씌움) */
        .court-btn.booked.group-1 { background-color: #ef9a9a !important; color: #b71c1c !important; }
        .court-btn.booked.group-2 { background-color: #90caf9 !important; color: #0d47a1 !important; }
        .court-btn.booked.group-3 { background-color: #a5d6a7 !important; color: #1b5e20 !important; }
        .court-btn.booked.group-4 { background-color: #ffcc80 !important; color: #e65100 !important; }
        .court-btn.booked.group-5 { background-color: #ce93d8 !important; color: #4a148c !important; }
        .court-btn.booked.group-6 { background-color: #80deea !important; color: #006064 !important; }
        .court-btn.booked.group-7 { background-color: #ffab91 !important; color: #bf360c !important; }
        .court-btn.booked.group-8 { background-color: #f48fb1 !important; color: #880e4f !important; }

        /* ==================== 모바일 최적화 ==================== */
        @media (max-width: 768px) {
            body { padding: 6px; }
            .nav-controls { gap: 10px; margin-bottom: 8px; }
            .nav-btn { padding: 7px 12px; font-size: 15px; }
            .current-month { font-size: 18px; }
            .btn-group { gap: 5px; margin-bottom: 6px; }
            .btn-group:last-of-type { margin-bottom: 14px; }
            .action-btn { padding: 8px 10px; font-size: 11px; border-radius: 7px; box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
            #capture-calendar-area { padding: 6px; border-radius: 8px; }
            /* 제목바: 모바일에서는 세로로 쌓기 */
            .calendar-title-bar { flex-direction: column; gap: 8px; margin-bottom: 10px !important; min-height: 0; }
            .calendar-title-bar .title-center { order: 1; }
            .calendar-title-bar .title-left { position: static; transform: none; order: 2; gap: 6px; max-width: 100%; align-items: center; }
            .calendar-title-bar .title-left-top { flex-wrap: wrap; justify-content: center; }
            .name-filters { justify-content: center; }
            #quick-name { width: 110px; padding: 7px 10px; font-size: 13px; }
            #capture-calendar-area .title-center h1 { font-size: 16px !important; }
            #capture-calendar-area .title-center p { font-size: 11px !important; margin: 2px 0 0 !important; }
            .calendar-grid { gap: 2px; }
            .day-label { padding: 5px 1px; font-size: 11px; border-radius: 3px; }
            .day-card { padding: 3px 2px; min-height: 110px; border-radius: 4px; }
            .date-header { margin-bottom: 3px; padding-bottom: 2px; gap: 2px; }
            /* 날짜 영역 줄바꿈 방지 */
            .date-header > div:first-child { flex-wrap: nowrap !important; min-width: 0; flex: 1; }
            .date-num { font-size: 10px; padding: 1px 2px; white-space: nowrap; }
            .holiday-name, .anni-name { display: none; }
            .edit-mode-btn { font-size: 10px; padding: 0 1px; flex-shrink: 0; }

            /* 코트 버튼: 글자 숨기고 색상 블록으로 */
            .court-row { gap: 1px; margin-bottom: 1px; position: relative; }
            .time-label { display: none; }
            .court-btn {
                height: 16px;
                font-size: 0;          /* 텍스트 시각적으로 숨김 */
                color: transparent;
                border-radius: 2px;
                padding: 0;
                line-height: 1;
                position: relative;
            }
            /* 빈 칸(예약 안 된 회색)에만 시간 숫자 옅게 표시 */
            .court-btn:not(.booked)::before {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 9px;
                color: rgba(0, 0, 0, 0.32);
                font-weight: bold;
                font-family: serif;
                pointer-events: none;
                line-height: 1;
            }
            .court-btn:not(.booked)[data-time-start]::before { content: attr(data-time-start); }
            .court-btn:not(.booked)[data-time-mid]::before { content: attr(data-time-mid); font-size: 8px; }
            .court-btn:not(.booked)[data-time-end]::before { content: attr(data-time-end); }
            /* 커스텀 모드 entry: 글자 숨기고 색상 블록만 */
            .custom-container { gap: 2px; }
            .custom-entry {
                font-size: 0;
                color: transparent;
                padding: 0;
                height: 18px;
                border-radius: 3px;
            }
            .custom-entry .custom-time-view { display: none; }
            .custom-entry > div { display: none; }
            .custom-add-btn { padding: 2px; font-size: 9px; height: 16px; line-height: 1; }

            /* 모달 */
            .modal { width: 92vw; max-width: 340px; padding: 18px; }
            .modal input { width: 88%; padding: 10px; font-size: 14px; }
            .conflict-modal { width: 94vw; padding: 18px; }
            .conflict-modal h3 { font-size: 16px; }
            .conflict-desc { font-size: 12px; }
            .conflict-item { font-size: 12px; }
            .modal-buttons { flex-direction: column; gap: 6px; }
            .m-btn { padding: 10px; font-size: 13px; }
        }
        @media (max-width: 380px) {
            .day-card { min-height: 95px; padding: 2px 1px; }
            .date-num { font-size: 9px; padding: 1px; }
            .edit-mode-btn { font-size: 9px; }
            .court-btn { height: 14px; }
            .custom-entry { height: 15px; }
        }
    </style>
</head>
<body>

<div class="header-container">
    <div class="nav-controls">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <span class="current-month" id="month-display"></span>
        <button class="nav-btn" onclick="changeMonth(1)">▶</button>
    </div>
    <div class="btn-group">
        <button class="action-btn btn-cal" onclick="captureCalendarImage()">📸 달력형 저장</button>
        <button class="action-btn btn-list" onclick="captureSummaryImage()">📝 요약형 저장</button>
        <button class="action-btn btn-copy" onclick="copyToClipboard()">📋 텍스트 복사</button>
        <button class="action-btn btn-excel" onclick="downloadExcel()">📊 엑셀 저장</button>
    </div>
    <div class="btn-group">
        <button class="action-btn btn-save" onclick="exportData()">💾 백업 저장</button>
        <button class="action-btn btn-load" onclick="document.getElementById('fileInput').click()">📂 불러오기</button>
        <input type="file" id="fileInput" style="display:none" accept=".json,.png,image/png,application/json" onchange="importData(event)">
    </div>
    </div>
</div>

<div id="capture-calendar-area">
    <div class="calendar-title-bar">
        <div class="title-left no-capture">
            <div class="title-left-top">
                <input type="text" id="quick-name" placeholder="예약자 이름" maxlength="2" oninput="saveQuickName()">
                <button class="action-btn btn-clear" onclick="clearMonthData()">🗑️ 이달 데이터 삭제</button>
            </div>
            <div class="name-filters" id="name-filters"></div>
        </div>
        <div class="title-center">
            <h1 style="margin:0; font-size:28px; color:#2c3e50;">한미모스 테니스 클럽</h1>
            <p class="sub-date-text" style="color:#666; font-weight:bold;"></p>
        </div>
        <div class="title-right no-capture"></div>
    </div>
    <div class="calendar-grid" id="calendar"></div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h3 id="modal-title">정보 입력</h3>
        <div id="normal-inputs"><input type="text" id="modal-input" placeholder="이름 입력 (최대2자)"></div>
        <div id="custom-inputs" style="display:none;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 10px;">
                <input type="number" id="custom-time-start" placeholder="8" style="width: 60px; margin:0;"><span style="font-weight: bold;">시 ~</span>
                <input type="number" id="custom-time-end" placeholder="10" style="width: 60px; margin:0;"><span style="font-weight: bold;">시</span>
            </div>
            <input type="text" id="custom-place" placeholder="장소">
            <input type="text" id="custom-court" placeholder="코트/번호">
        </div>
        <div id="anni-inputs" style="display:none;">
            <input type="text" id="anni-input" placeholder="행사 내용">
            <label style="display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-weight: bold; color: #d35400;">
                <input type="checkbox" id="check-special" style="width: 20px; height: 20px;"> 특별한 날 강조
            </label>
        </div>
        <div id="import-desc" style="display:none; text-align:left; font-size:13px; color:#555; line-height:1.6; padding: 4px 2px;"></div>
        <div class="modal-buttons" id="modal-btn-container"></div>
    </div>
</div>

<div id="conflict-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1001; justify-content:center; align-items:center;">
    <div class="conflict-modal">
        <h3>⚠️ 중복된 항목이 있습니다</h3>
        <div class="conflict-desc" id="conflict-desc"></div>
        <div class="conflict-list" id="conflict-list"></div>
        <div class="modal-buttons">
            <button class="m-btn m-keep" id="btn-keep-existing">기존 유지</button>
            <button class="m-btn m-replace" id="btn-replace-new">새 데이터로 덮어쓰기</button>
            <button class="m-btn m-cancel" id="btn-conflict-cancel">취소</button>
        </div>
    </div>
</div>

<script>
    const _today = new Date();
    let currentYear = _today.getFullYear();
    let currentMonth = _today.getMonth() + 1;
    let reservationData = JSON.parse(localStorage.getItem('tennisData')) || {};
    let customModes = JSON.parse(localStorage.getItem('customModes')) || {}; 
    let anniversaryData = JSON.parse(localStorage.getItem('anniversaryData')) || {}; 
    // 누적 불러오기 시 각 데이터의 그룹(불러오기 회차) 추적
    let dataGroups = JSON.parse(localStorage.getItem('dataGroups')) || {}; 
    let nextGroupId = parseInt(localStorage.getItem('nextGroupId')) || 1;
    const MAX_GROUP_COLORS = 8;
    // 필터: 비활성화된(꺼진) 이름 집합
    let hiddenNames = new Set(JSON.parse(localStorage.getItem('hiddenNames') || '[]'));
    let activeKey = null;
    const timeSlots = ["08-10", "10-12", "12-14", "14-16", "16-18"];

    // 예약자 이름 빠른 입력 관련
    function saveQuickName() {
        const input = document.getElementById('quick-name');
        const val = input.value.trim().substring(0, 2);
        localStorage.setItem('quickName', val);
        if (val) input.classList.add('has-value');
        else input.classList.remove('has-value');
    }

    function loadQuickName() {
        const saved = localStorage.getItem('quickName') || '';
        const input = document.getElementById('quick-name');
        input.value = saved;
        if (saved) input.classList.add('has-value');
    }

    // 필터: 현재 보고 있는 달의 코트 예약에서 사용된 이름 목록 + 카운트
    function getNamesInCurrentMonth() {
        const prefix = `${currentYear}-${currentMonth}-`;
        const counts = {};
        Object.keys(reservationData).forEach(k => {
            if (!k.startsWith(prefix)) return;
            const val = reservationData[k];
            // 일반 코트 예약(문자열)만 대상. 커스텀 일정(배열)은 제외.
            if (typeof val === 'string' && val) {
                counts[val] = (counts[val] || 0) + 1;
            }
        });
        return counts;
    }

    function renderNameFilters() {
        const container = document.getElementById('name-filters');
        const counts = getNamesInCurrentMonth();
        const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

        // 비활성 목록에서 더 이상 존재하지 않는 이름은 정리
        Array.from(hiddenNames).forEach(n => { if (!counts[n]) hiddenNames.delete(n); });
        localStorage.setItem('hiddenNames', JSON.stringify(Array.from(hiddenNames)));

        container.innerHTML = '';
        if (names.length < 2) return; // 1명 이하면 필터 숨김

        names.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            if (hiddenNames.has(name)) btn.classList.add('off');
            btn.innerHTML = `${escapeHtml(name)}<span class="filter-count">${counts[name]}</span>`;
            btn.onclick = () => toggleNameFilter(name);
            container.appendChild(btn);
        });
    }

    function toggleNameFilter(name) {
        if (hiddenNames.has(name)) hiddenNames.delete(name);
        else hiddenNames.add(name);
        localStorage.setItem('hiddenNames', JSON.stringify(Array.from(hiddenNames)));
        renderCalendar();
    }

    function handleCourtClick(key) {
        const existingName = reservationData[key];
        // 필터로 숨겨진 칸을 클릭한 경우: 모달로 띄워 사용자가 인지하게 함
        if (existingName && hiddenNames.has(existingName)) {
            openNormalModal(key);
            return;
        }
        const quickName = (document.getElementById('quick-name').value || '').trim().substring(0, 2);
        if (quickName) {
            // 이름이 입력되어 있으면 자동 저장 (모달 없이)
            // 이미 같은 이름이 있으면 삭제(토글), 아니면 저장
            if (existingName === quickName) {
                delete reservationData[key];
                delete dataGroups[key];
            } else {
                reservationData[key] = quickName;
                delete dataGroups[key]; // 직접 입력은 그룹 색상 없음
            }
            localStorage.setItem('tennisData', JSON.stringify(reservationData));
            localStorage.setItem('dataGroups', JSON.stringify(dataGroups));

    function getHolidays(year) {
        const solarHolidays = { "1-1":"신정", "3-1":"삼일절", "5-5":"어린이날", "6-6":"현충일", "8-15":"광복절", "10-3":"개천절", "10-9":"한글날", "12-25":"성탄절", "12-12":"창립기념일" };
        const lunarHolidays = {
            2025: { "1-28":"설날연휴", "1-29":"설날", "1-30":"설날연휴", "5-5":"부처님오신날", "10-5":"추석연휴", "10-6":"추석", "10-7":"추석연휴" },
            2026: { "2-16":"설날연휴", "2-17":"설날", "2-18":"설날연휴", "5-24":"부처님오신날", "9-24":"추석연휴", "9-25":"추석", "9-26":"추석연휴" }
        };
        let combined = { ...solarHolidays };
        if (lunarHolidays[year]) combined = { ...combined, ...lunarHolidays[year] };
        if (year === 2026) { combined["3-2"] = "대체공휴일"; combined["5-25"] = "대체공휴일"; combined["8-17"] = "대체공휴일"; combined["10-5"] = "대체공휴일"; }
        return combined;
    }

    // ===== PNG tEXt 청크 처리 유틸 (JSON 임베드/추출) =====
    // PNG 파일에 보이지 않는 메타데이터로 JSON을 숨겨 저장하고,
    // 같은 PNG를 불러올 때 정확하게 복원할 수 있게 함.
    const PNG_TEXT_KEYWORD = 'hanmimos-data';

    // CRC32 테이블 (PNG 청크 CRC 계산용)
    const _crcTable = (() => {
        const table = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
            let c = n;
            for (let k = 0; k < 8; k++) {
                c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
            }
            table[n] = c >>> 0;
        }
        return table;
    })();
    function _crc32(bytes) {
        let crc = 0xFFFFFFFF;
        for (let i = 0; i < bytes.length; i++) {
            crc = (_crcTable[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8)) >>> 0;
        }
        return (crc ^ 0xFFFFFFFF) >>> 0;
    }
    // dataURL("data:image/png;base64,....") -> Uint8Array
    function _dataURLToBytes(dataURL) {
        const base64 = dataURL.split(',')[1];
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }
    // PNG 바이트에 tEXt 청크 삽입 (IHDR 다음 위치에 삽입)
    function _embedTextChunk(pngBytes, keyword, text) {
        // PNG 시그니처(8 bytes) 검증
        const sig = [137, 80, 78, 71, 13, 10, 26, 10];
        for (let i = 0; i < 8; i++) {
            if (pngBytes[i] !== sig[i]) throw new Error('유효한 PNG 파일이 아닙니다.');
        }
        // IHDR 청크 위치: 시그니처(8) + 길이(4) + 타입(4) + 데이터(13) + CRC(4) = 33
        const ihdrEnd = 8 + 4 + 4 + 13 + 4; // 33

        // tEXt 청크 데이터: keyword + 0x00 + text (Latin-1 권장이지만 실제로는 바이트 배열)
        // JSON에 한글이 있을 수 있으므로 UTF-8로 인코딩.
        // 호환성을 위해 일부 PNG 리더가 Latin-1만 받을 수 있어 zTXt 대신 tEXt + UTF-8 사용.
        const keywordBytes = new TextEncoder().encode(keyword);
        const textBytes = new TextEncoder().encode(text);
        const dataLen = keywordBytes.length + 1 + textBytes.length;

        // 청크 = [길이(4)] + [타입 'tEXt'(4)] + [데이터] + [CRC(4)]
        const chunk = new Uint8Array(4 + 4 + dataLen + 4);
        // 길이 (big-endian)
        chunk[0] = (dataLen >>> 24) & 0xFF;
        chunk[1] = (dataLen >>> 16) & 0xFF;
        chunk[2] = (dataLen >>> 8) & 0xFF;
        chunk[3] = dataLen & 0xFF;
        // 타입
        chunk[4] = 0x74; chunk[5] = 0x45; chunk[6] = 0x58; chunk[7] = 0x74; // 'tEXt'
        // 데이터
        chunk.set(keywordBytes, 8);
        chunk[8 + keywordBytes.length] = 0x00; // null separator
        chunk.set(textBytes, 8 + keywordBytes.length + 1);
        // CRC: 타입 + 데이터에 대해 계산
        const crcInput = chunk.subarray(4, 8 + dataLen);
        const crc = _crc32(crcInput);
        const crcOffset = 8 + dataLen;
        chunk[crcOffset] = (crc >>> 24) & 0xFF;
        chunk[crcOffset + 1] = (crc >>> 16) & 0xFF;
        chunk[crcOffset + 2] = (crc >>> 8) & 0xFF;
        chunk[crcOffset + 3] = crc & 0xFF;

        // 결과 = [원본 PNG 앞부분(IHDR 끝까지)] + [tEXt 청크] + [원본 PNG 나머지]
        const result = new Uint8Array(pngBytes.length + chunk.length);
        result.set(pngBytes.subarray(0, ihdrEnd), 0);
        result.set(chunk, ihdrEnd);
        result.set(pngBytes.subarray(ihdrEnd), ihdrEnd + chunk.length);
        return result;
    }
    // PNG에서 지정한 keyword의 tEXt 청크 텍스트 추출 (없으면 null)
    function _extractTextChunk(pngBytes, keyword) {
        const sig = [137, 80, 78, 71, 13, 10, 26, 10];
        for (let i = 0; i < 8; i++) {
            if (pngBytes[i] !== sig[i]) return null;
        }
        const keywordBytes = new TextEncoder().encode(keyword);
        let pos = 8;
        const decoder = new TextDecoder('utf-8');
        while (pos + 8 <= pngBytes.length) {
            const len = (pngBytes[pos] << 24) | (pngBytes[pos+1] << 16) | (pngBytes[pos+2] << 8) | pngBytes[pos+3];
            const type = String.fromCharCode(pngBytes[pos+4], pngBytes[pos+5], pngBytes[pos+6], pngBytes[pos+7]);
            const dataStart = pos + 8;
            const dataEnd = dataStart + len;
            if (dataEnd + 4 > pngBytes.length) break;
            if (type === 'tEXt') {
                // keyword 매칭 확인
                let match = true;
                if (keywordBytes.length + 1 > len) match = false;
                else {
                    for (let i = 0; i < keywordBytes.length; i++) {
                        if (pngBytes[dataStart + i] !== keywordBytes[i]) { match = false; break; }
                    }
                    if (match && pngBytes[dataStart + keywordBytes.length] !== 0x00) match = false;
                }
                if (match) {
                    const textStart = dataStart + keywordBytes.length + 1;
                    return decoder.decode(pngBytes.subarray(textStart, dataEnd));
                }
            }
            if (type === 'IEND') break;
            pos = dataEnd + 4; // CRC 다음으로
        }
        return null;
    }

    async function captureCalendarImage() {
        const area = document.getElementById('capture-calendar-area');
        const editButtons = document.querySelectorAll('.edit-mode-btn, .custom-add-btn');
        const noCaptureEls = document.querySelectorAll('#capture-calendar-area .no-capture');
        editButtons.forEach(btn => btn.style.visibility = 'hidden');
        // no-capture 영역은 display:none으로 완전히 빼고, 원래 display 값 백업
        const prevDisplays = [];
        noCaptureEls.forEach(el => { prevDisplays.push(el.style.display); el.style.display = 'none'; });
        const canvas = await html2canvas(area, { scale: 2 });
        editButtons.forEach(btn => btn.style.visibility = 'visible');
        noCaptureEls.forEach((el, i) => { el.style.display = prevDisplays[i]; });

        // === PNG에 JSON 데이터 숨겨 넣기 ===
        const dataURL = canvas.toDataURL('image/png');
        let finalBlobUrl = dataURL;
        try {
            const pngBytes = _dataURLToBytes(dataURL);
            const payload = JSON.stringify({
                version: 1,
                savedAt: new Date().toISOString(),
                year: currentYear,
                month: currentMonth,
                reservationData,
                customModes,
                anniversaryData
            });
            const newBytes = _embedTextChunk(pngBytes, PNG_TEXT_KEYWORD, payload);
            const blob = new Blob([newBytes], { type: 'image/png' });
            finalBlobUrl = URL.createObjectURL(blob);
        } catch (err) {
            console.warn('PNG에 데이터 임베드 실패, 원본 이미지로 저장합니다.', err);
        }

        const link = document.createElement('a');
        link.download = `한미모스_달력_${currentYear}_${currentMonth}.png`;
        link.href = finalBlobUrl;
        link.click();
        // blob URL 메모리 해제
        if (finalBlobUrl.startsWith('blob:')) {
            setTimeout(() => URL.revokeObjectURL(finalBlobUrl), 1000);
        }
    }

    function copyToClipboard() {
        let text = `🎾 한미모스 테니스 클럽 ${currentMonth}월 일정\n\n`;
        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        let hasData = false;
        for(let d=1; d<=daysInMonth; d++) {
            const dateKey = `${currentYear}-${currentMonth}-${d}`;
            let dayText = "";
            if(customModes[dateKey]) {
                const entries = reservationData[dateKey] || [];
                entries.forEach(item => { dayText += `${currentMonth}/${d} [${item.time}] ${item.place} : ${item.court}\n`; });
            } else {
                timeSlots.forEach(time => {
                    const start = time.split('-')[0];
                    let bookedCourts = []; let names = [];
                    for(let c=1; c<=3; c++) {
                        const key = `${dateKey}-${start}-${c}`;
                        if(reservationData[key]) { bookedCourts.push(c); names.push(reservationData[key]); }
                    }
                    if(bookedCourts.length > 0) {
                        const uniqueNames = [...new Set(names)].join(',');
                        const courtNumbers = bookedCourts.join(',');
                        dayText += `${currentMonth}/${d} [${start}시] 코트${courtNumbers} : ${uniqueNames}\n`;

                });

    function downloadExcel() {
        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
        let header = ["날짜", "요일"];
        timeSlots.forEach(time => {
            const hour = time.split('-')[0];
            for(let c = 1; c <= 3; c++) {
                header.push(`${hour}시(C${c})`);
            }
        });
        let rows = [header];
        for(let d = 1; d <= daysInMonth; d++) {
            const dateKey = `${currentYear}-${currentMonth}-${d}`;
            const dateObj = new Date(currentYear, currentMonth - 1, d);
            const dayName = weekDays[dateObj.getDay()];
            let row = [`${currentMonth}/${d}`, dayName];
            if (customModes[dateKey]) {
                timeSlots.forEach(() => { for(let c=1; c<=3; c++) row.push("-"); });
            } else {
                timeSlots.forEach(time => {
                    const hour = time.split('-')[0];
                    for(let c = 1; c <= 3; c++) {
                        const key = `${dateKey}-${hour}-${c}`;
                        row.push(reservationData[key] || "-");

        const worksheet = XLSX.utils.aoa_to_sheet(rows);

    }

    // 백업 저장 파일명 수정 (YYMMDD_v01 형식)
    function exportData() {
        const now = new Date();
        const year = String(now.getFullYear()).substring(2);
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateStr = `${year}${month}${day}`;

        // 오늘 날짜의 마지막 버전 번호 가져오기
        let lastDate = localStorage.getItem('lastBackupDate');
        let version = parseInt(localStorage.getItem('lastBackupVersion')) || 0;

        if (lastDate === dateStr) {
            version += 1;
        } else {
            version = 1;
            localStorage.setItem('lastBackupDate', dateStr);
        }
        localStorage.setItem('lastBackupVersion', version);

        const versionStr = String(version).padStart(2, '0');
        // 예약자 이름이 있으면 파일명에 포함 (파일명에 못 쓰는 문자 제거)
        const quickName = (localStorage.getItem('quickName') || '').trim();
        const safeName = quickName.replace(/[\\/:*?"<>|]/g, '');
        const namePart = safeName ? `${safeName}_` : '';
        const fileName = `한미모스_${namePart}${dateStr}_v${versionStr}.json`;

        const link = document.createElement('a');
        link.href = 'data:application/json;charset=utf-8,'+ encodeURIComponent(JSON.stringify({reservationData, customModes, anniversaryData}));
        link.download = fileName;
        link.click();
    }

    function importData(e) {
        const file = e.target.files[0];
        if (!file) return;

        const isPng = file.type === 'image/png' || /\.png$/i.test(file.name);
        const reader = new FileReader();

        reader.onload = (le) => {
            let imported;
            if (isPng) {
                // PNG에서 tEXt 청크로 숨겨둔 JSON 추출
                try {
                    const bytes = new Uint8Array(le.target.result);
                    const text = _extractTextChunk(bytes, PNG_TEXT_KEYWORD);
                    if (!text) {
                        alert('이 PNG에는 한미모스 데이터가 포함되어 있지 않습니다.\n(달력형 저장으로 만든 이미지여야 불러올 수 있어요)');
                        return;
                    }
                    imported = JSON.parse(text);
                } catch (err) {
                    alert('PNG에서 데이터를 읽는 데 실패했습니다.');
                    return;
                }
            } else {
                try {
                    imported = JSON.parse(le.target.result);
                } catch (err) {
                    alert('파일을 읽을 수 없습니다. 올바른 백업 파일인지 확인해주세요.');
                    return;
                }
            }

            // 기존 데이터가 있는지 확인
            const hasExistingData = Object.keys(reservationData).length > 0 
                                 || Object.keys(customModes).length > 0 
                                 || Object.keys(anniversaryData).length > 0;

            if (!hasExistingData) {
                // 기존 데이터가 없으면 그냥 덮어쓰기 (그룹 1로 시작)
                applyImport(imported, 'overwrite');
            } else {
                // 선택 모달 표시
                showImportChoiceModal(imported);
            }
        };

        if (isPng) reader.readAsArrayBuffer(file);
        else reader.readAsText(file);

        // 같은 파일 다시 선택 가능하도록 input 초기화
        e.target.value = '';
    }

    function showImportChoiceModal(imported) {
        const overlay = document.getElementById('modal-overlay');
        document.getElementById('modal-title').innerText = "불러오기 방식 선택";
        document.getElementById('normal-inputs').style.display = 'none';
        document.getElementById('custom-inputs').style.display = 'none';
        document.getElementById('anni-inputs').style.display = 'none';

        const desc = document.getElementById('import-desc');
        desc.style.display = 'block';
        desc.innerHTML = `
            기존 데이터가 있습니다.<br>
            <b style="color:#27ae60;">누적</b>: 기존 데이터에 합치며, 새로 불러온 칸은 다른 색으로 표시됩니다.<br>
            <b style="color:#e67e22;">덮어쓰기</b>: 기존 데이터를 모두 지우고 새 데이터로 교체합니다.
        `;

        const container = document.getElementById('modal-btn-container');
        container.innerHTML = `
            <button class="m-btn m-merge" id="btn-merge-act">누적</button>
            <button class="m-btn m-overwrite" id="btn-overwrite-act">덮어쓰기</button>
            <button class="m-btn m-cancel" onclick="closeModal()">취소</button>
        `;
        document.getElementById('btn-merge-act').onclick = () => { applyImport(imported, 'merge'); closeModal(); };
        document.getElementById('btn-overwrite-act').onclick = () => {
            if (confirm('정말 기존 데이터를 모두 덮어쓸까요?')) { applyImport(imported, 'overwrite'); closeModal(); }
        };
        overlay.style.display = 'flex';
    }

    function applyImport(imported, mode) {
        const newReservation = imported.reservationData || {};
        const newCustomModes = imported.customModes || {};
        const newAnniversary = imported.anniversaryData || {};

        if (mode === 'overwrite') {
            // 모두 지우고 교체. 그룹은 1로 초기화
            reservationData = newReservation;
            customModes = newCustomModes;
            anniversaryData = newAnniversary;
            dataGroups = {};
            nextGroupId = 1;
            // 새로 불러온 모든 데이터를 그룹 1로 표시
            assignGroupToAllData(1);
            nextGroupId = 2;
            saveAndRender();
            return;
        }

        // 누적 모드: 먼저 중복 감지
        const conflicts = detectConflicts(newReservation, newAnniversary);

        if (conflicts.length === 0) {
            // 중복 없음 → 바로 누적
            performMerge(imported, 'replace'); // 어차피 중복이 없으니 둘 다 동일
        } else {
            // 중복 있음 → 모달로 사용자에게 물어보기
            showConflictModal(conflicts, imported);
        }
    }

    function detectConflicts(newReservation, newAnniversary) {
        const conflicts = [];

        // 일반 코트 예약 중복 체크
        Object.keys(newReservation).forEach(k => {
            const val = newReservation[k];
            if (Array.isArray(val)) {
                // 커스텀 모드: 같은 날짜에 같은 (시간+장소+코트) 조합이 있으면 중복
                const existing = reservationData[k];
                if (Array.isArray(existing)) {
                    val.forEach(newItem => {
                        const dup = existing.find(e => e.time === newItem.time && e.place === newItem.place && e.court === newItem.court);
                        if (dup) {
                            conflicts.push({
                                type: 'custom',
                                key: k,
                                label: `${formatDateLabel(k)} 커스텀 일정`,
                                oldValue: `${dup.time} / ${dup.place} / ${dup.court}`,
                                newValue: `${newItem.time} / ${newItem.place} / ${newItem.court}`,
                                newItem: newItem
                            });
                        }
                    });
                }
            } else {
                // 일반 코트 예약: 같은 키에 다른 값이 있으면 중복 (같은 값이면 중복 아님)
                if (reservationData[k] !== undefined && reservationData[k] !== val) {
                    conflicts.push({
                        type: 'court',
                        key: k,
                        label: formatCourtLabel(k),
                        oldValue: reservationData[k],
                        newValue: val
                    });
                }
            }
        });

        // 기념일 중복 체크
        Object.keys(newAnniversary).forEach(k => {
            const newAnni = newAnniversary[k];
            const oldAnni = anniversaryData[k];
            if (oldAnni && (oldAnni.name !== newAnni.name || oldAnni.special !== newAnni.special)) {
                conflicts.push({
                    type: 'anni',
                    key: k,
                    label: `${formatDateLabel(k)} 기념일/강조`,
                    oldValue: `${oldAnni.name || '(이름없음)'}${oldAnni.special ? ' ⭐' : ''}`,
                    newValue: `${newAnni.name || '(이름없음)'}${newAnni.special ? ' ⭐' : ''}`
                });
            }
        });

        return conflicts;
    }

    function formatDateLabel(key) {
        // "2026-2-15" → "2026.02.15"
        const m = key.match(/^(\d+)-(\d+)-(\d+)/);
        if (m) return `${m[1]}.${String(m[2]).padStart(2,'0')}.${String(m[3]).padStart(2,'0')}`;
        return key;
    }

    function formatCourtLabel(key) {
        // "2026-2-15-08-2" → "2026.02.15 08시 C2"
        const parts = key.split('-');
        if (parts.length >= 5) {
            return `${parts[0]}.${String(parts[1]).padStart(2,'0')}.${String(parts[2]).padStart(2,'0')} ${parts[3]}시 C${parts[4]}`;
        }
        return key;
    }

    function showConflictModal(conflicts, imported) {
        const overlay = document.getElementById('conflict-overlay');
        const desc = document.getElementById('conflict-desc');
        const list = document.getElementById('conflict-list');

        desc.innerHTML = `중복된 항목이 <b>${conflicts.length}건</b> 있습니다. 어떻게 처리할까요?<br>
            <span style="color:#7f8c8d;">• <b>기존 유지</b>: 중복 항목은 무시하고 새로운 것만 추가합니다.</span><br>
            <span style="color:#e67e22;">• <b>새 데이터로 덮어쓰기</b>: 중복 항목을 새 파일의 값으로 교체합니다.</span>`;

        list.innerHTML = '';
        conflicts.forEach(c => {
            const item = document.createElement('div');
            item.className = 'conflict-item';
            item.innerHTML = `
                <div class="conflict-item-header">${c.label}</div>
                <div>
                    <span class="conflict-old">기존: ${escapeHtml(c.oldValue)}</span>
                    <span class="conflict-arrow">→</span>
                    <span class="conflict-new">새 파일: ${escapeHtml(c.newValue)}</span>
                </div>
            `;
            list.appendChild(item);
        });

        document.getElementById('btn-keep-existing').onclick = () => {
            overlay.style.display = 'none';
            performMerge(imported, 'keep', conflicts);
        };
        document.getElementById('btn-replace-new').onclick = () => {
            overlay.style.display = 'none';
            performMerge(imported, 'replace', conflicts);
        };
        document.getElementById('btn-conflict-cancel').onclick = () => {
            overlay.style.display = 'none';
        };

        overlay.style.display = 'flex';
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function performMerge(imported, conflictMode, conflicts = []) {
        const newReservation = imported.reservationData || {};
        const newCustomModes = imported.customModes || {};
        const newAnniversary = imported.anniversaryData || {};

        // 중복 키 집합 만들기 (빠른 조회용)
        const conflictCourtKeys = new Set();
        const conflictAnniKeys = new Set();
        const conflictCustomItems = new Map(); // dateKey → Set of "time|place|court"
        conflicts.forEach(c => {
            if (c.type === 'court') conflictCourtKeys.add(c.key);
            else if (c.type === 'anni') conflictAnniKeys.add(c.key);
            else if (c.type === 'custom') {
                if (!conflictCustomItems.has(c.key)) conflictCustomItems.set(c.key, new Set());
                conflictCustomItems.get(c.key).add(`${c.newItem.time}|${c.newItem.place}|${c.newItem.court}`);
            }
        });

        const groupId = nextGroupId;
        nextGroupId += 1;

        // customModes 병합
        Object.keys(newCustomModes).forEach(k => {
            if (newCustomModes[k]) customModes[k] = true;
        });

        // anniversaryData 병합
        Object.keys(newAnniversary).forEach(k => {
            if (!anniversaryData[k]) {
                anniversaryData[k] = newAnniversary[k];
            } else if (conflictAnniKeys.has(k) && conflictMode === 'replace') {
                anniversaryData[k] = newAnniversary[k];
            }
            // 그 외(중복인데 keep, 또는 동일 값)는 기존 유지
        });

        // reservationData 병합
        Object.keys(newReservation).forEach(k => {
            const val = newReservation[k];
            if (Array.isArray(val)) {
                if (!reservationData[k]) reservationData[k] = [];
                const dupSet = conflictCustomItems.get(k) || new Set();
                val.forEach(item => {
                    const sig = `${item.time}|${item.place}|${item.court}`;
                    if (dupSet.has(sig)) {
                        // 중복 항목
                        if (conflictMode === 'replace') {
                            // 기존에서 같은 항목 찾아서 교체 (그룹도 새로 부여)
                            const idx = reservationData[k].findIndex(e => e.time === item.time && e.place === item.place && e.court === item.court);
                            if (idx >= 0) {
                                reservationData[k][idx] = item;
                                dataGroups[`${k}-custom-${idx}`] = groupId;
                            }
                        }
                        // keep이면 무시
                    } else {
                        // 중복 아님 → 추가
                        const newIdx = reservationData[k].length;
                        reservationData[k].push(item);
                        dataGroups[`${k}-custom-${newIdx}`] = groupId;
                    }
                });
            } else {
                if (reservationData[k] === undefined) {
                    // 빈 칸 → 그냥 추가
                    reservationData[k] = val;
                    dataGroups[k] = groupId;
                } else if (conflictCourtKeys.has(k)) {
                    // 중복 → 모드에 따라
                    if (conflictMode === 'replace') {
                        reservationData[k] = val;
                        dataGroups[k] = groupId;
                    }
                }
                // 동일 값(중복 아님)은 기존 유지
            }
        });

        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('tennisData', JSON.stringify(reservationData));
        localStorage.setItem('customModes', JSON.stringify(customModes));
        localStorage.setItem('anniversaryData', JSON.stringify(anniversaryData));
        localStorage.setItem('dataGroups', JSON.stringify(dataGroups));
        localStorage.setItem('nextGroupId', String(nextGroupId));
        renderCalendar();
    }

    function assignGroupToAllData(groupId) {
        // 현재 reservationData의 모든 항목에 그룹 ID 할당
        Object.keys(reservationData).forEach(k => {
            const val = reservationData[k];
            if (Array.isArray(val)) {
                val.forEach((_, idx) => {
                    dataGroups[`${k}-custom-${idx}`] = groupId;
                });
            } else {
                dataGroups[k] = groupId;
            }
        });
    }

    function openAnniModal(dateKey) {
        activeKey = dateKey; document.getElementById('modal-title').innerText = "강조 & 기념일 설정";
        document.getElementById('normal-inputs').style.display = 'none'; document.getElementById('custom-inputs').style.display = 'none';
        document.getElementById('anni-inputs').style.display = 'block';
        const data = anniversaryData[dateKey] || { name: "", special: false };
        document.getElementById('anni-input').value = data.name; document.getElementById('check-special').checked = data.special;
        updateButtons(!!anniversaryData[dateKey], saveAnni, deleteAnni);
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function saveAnni() {
        const name = document.getElementById('anni-input').value.trim();
        const special = document.getElementById('check-special').checked;
        if(name || special) anniversaryData[activeKey] = { name, special }; else delete anniversaryData[activeKey];
        localStorage.setItem('anniversaryData', JSON.stringify(anniversaryData)); closeModal(); renderCalendar();
    }

    function deleteAnni() { delete anniversaryData[activeKey]; localStorage.setItem('anniversaryData', JSON.stringify(anniversaryData)); closeModal(); renderCalendar(); }
    function toggleMode(dateKey) { customModes[dateKey] = !customModes[dateKey]; localStorage.setItem('customModes', JSON.stringify(customModes)); renderCalendar(); }
    function closeModal() { 
        document.getElementById('modal-overlay').style.display = 'none'; 
        const desc = document.getElementById('import-desc');
        if (desc) desc.style.display = 'none';
    }
    function changeMonth(diff) { currentMonth += diff; if (currentMonth > 12) { currentMonth = 1; currentYear++; } else if (currentMonth < 1) { currentMonth = 12; currentYear--; } renderCalendar(); }
    function finalSave() { localStorage.setItem('tennisData', JSON.stringify(reservationData)); closeModal(); renderCalendar(); }

    function openNormalModal(key) {
        activeKey = key;
        // 키 형식: "2026-2-15-08-2" → 2026.02.15  08시 C2
        const parts = key.split('-');
        let titleText = "예약자 입력";
        if (parts.length >= 5) {
            titleText = `${parts[0]}.${String(parts[1]).padStart(2,'0')}.${String(parts[2]).padStart(2,'0')}  ${parts[3]}시 코트${parts[4]}`;
        }
        document.getElementById('modal-title').innerText = titleText;
        document.getElementById('normal-inputs').style.display = 'block'; document.getElementById('custom-inputs').style.display = 'none'; document.getElementById('anni-inputs').style.display = 'none';
        document.getElementById('modal-input').value = reservationData[key] || "";
        updateButtons(!!reservationData[key], saveNormal, deleteNormal);
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function openCustomModal(dateKey, index) {
        activeKey = { dateKey, index }; document.getElementById('modal-title').innerText = "상세 입력";
        document.getElementById('normal-inputs').style.display = 'none'; document.getElementById('custom-inputs').style.display = 'block'; document.getElementById('anni-inputs').style.display = 'none';
        const dayData = reservationData[dateKey] || [];
        const item = index >= 0 ? dayData[index] : { time: '', place: '', court: '' };
        const timeMatch = item.time.match(/(\d+)시~(\d+)시/);
        document.getElementById('custom-time-start').value = timeMatch ? timeMatch[1] : "";
        document.getElementById('custom-time-end').value = timeMatch ? timeMatch[2] : "";
        document.getElementById('custom-place').value = item.place; document.getElementById('custom-court').value = item.court;
        updateButtons(index >= 0, saveCustom, deleteCustom);
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function updateButtons(isEdit, saveFn, delFn) {
        const container = document.getElementById('modal-btn-container');
        container.innerHTML = `<button class="m-btn m-save" id="btn-save-act">저장</button>${isEdit ? `<button class="m-btn m-delete" id="btn-del-act">삭제</button>` : ''}<button class="m-btn m-cancel" onclick="closeModal()">취소</button>`;
        document.getElementById('btn-save-act').onclick = saveFn; if(isEdit) document.getElementById('btn-del-act').onclick = delFn;
    }

    function saveNormal() { 
        const val = document.getElementById('modal-input').value.trim(); 
        if(val) reservationData[activeKey] = val.substring(0, 2); 
        else { delete reservationData[activeKey]; delete dataGroups[activeKey]; }
        localStorage.setItem('dataGroups', JSON.stringify(dataGroups));
        finalSave(); 
    }
    function deleteNormal() { 
        delete reservationData[activeKey]; 
        delete dataGroups[activeKey];
        localStorage.setItem('dataGroups', JSON.stringify(dataGroups));
        finalSave(); 
    }
    function saveCustom() {
        const { dateKey, index } = activeKey;
        const start = document.getElementById('custom-time-start').value.trim(); const end = document.getElementById('custom-time-end').value.trim();
        const newItem = { time: (start && end) ? `${start}시~${end}시` : (start ? `${start}시` : ""), place: document.getElementById('custom-place').value.trim(), court: document.getElementById('custom-court').value.trim() };
        if(!reservationData[dateKey]) reservationData[dateKey] = [];
        if(index >= 0) reservationData[dateKey][index] = newItem; else reservationData[dateKey].push(newItem);
        finalSave();
    }
    function clearMonthData() {
        const monthLabel = `${currentYear}년 ${currentMonth}월`;
        if (!confirm(`${monthLabel}의 모든 입력 데이터를 삭제할까요?\n\n- 코트 예약\n- 커스텀 일정\n- 기념일/강조 표시\n\n이 작업은 되돌릴 수 없습니다.`)) return;

        const prefix = `${currentYear}-${currentMonth}-`;
        let deletedCount = 0;

        // reservationData에서 해당 월 데이터 삭제
        Object.keys(reservationData).forEach(k => {
            if (k.startsWith(prefix)) {
                delete reservationData[k];
                deletedCount++;
            }
        });

        // customModes에서 해당 월 데이터 삭제
        Object.keys(customModes).forEach(k => {
            if (k.startsWith(prefix)) delete customModes[k];
        });

        // anniversaryData에서 해당 월 데이터 삭제
        Object.keys(anniversaryData).forEach(k => {
            if (k.startsWith(prefix)) delete anniversaryData[k];
        });

        // dataGroups에서 해당 월 그룹 정보 삭제
        Object.keys(dataGroups).forEach(k => {
            if (k.startsWith(prefix)) delete dataGroups[k];
        });

        // 저장
        localStorage.setItem('tennisData', JSON.stringify(reservationData));
        localStorage.setItem('customModes', JSON.stringify(customModes));
        localStorage.setItem('anniversaryData', JSON.stringify(anniversaryData));
        localStorage.setItem('dataGroups', JSON.stringify(dataGroups));

        renderCalendar();
        alert(`${monthLabel} 데이터가 삭제되었습니다.`);
    }

    function deleteCustom() { 
        const { dateKey, index } = activeKey; 
        reservationData[dateKey].splice(index, 1); 
        // 그룹 정보 재정렬: 삭제된 인덱스 이후 항목들의 그룹 키를 재할당
        const oldGroups = {};
        Object.keys(dataGroups).forEach(k => {
            const m = k.match(/^(.+)-custom-(\d+)$/);
            if (m && m[1] === dateKey) oldGroups[parseInt(m[2])] = dataGroups[k];
            if (m && m[1] === dateKey) delete dataGroups[k];
        });
        Object.keys(oldGroups).forEach(idx => {
            const i = parseInt(idx);
            if (i < index) dataGroups[`${dateKey}-custom-${i}`] = oldGroups[i];
            else if (i > index) dataGroups[`${dateKey}-custom-${i-1}`] = oldGroups[i];
        });
        if(reservationData[dateKey].length === 0) delete reservationData[dateKey]; 
        localStorage.setItem('dataGroups', JSON.stringify(dataGroups));
        finalSave(); 
    }

    loadQuickName();
    renderCalendar();
</script>
