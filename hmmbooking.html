<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한미모스 테니스 클럽 관리</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --available: #81c784; --booked: #ef9a9a; --primary: #2c3e50; --holiday: #e53935; --anniversary-bg: #fff9c4; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f4f4; padding: 10px; color: #333; margin: 0; }
        
        .header-container { text-align: center; margin-bottom: 15px; padding-top: 10px; }
        .nav-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
        .nav-btn { padding: 8px 15px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .current-month { font-size: 20px; font-weight: bold; min-width: 120px; }
        
        .btn-group { display: flex; justify-content: center; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .action-btn { 
            padding: 10px 12px; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 12px; 
            transition: all 0.2s;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }
        .action-btn:active { transform: translateY(1px); box-shadow: none; }

        /* 🌈 무지개 순서 */
        .btn-cal { background-color: #ff5e57; }
        .btn-list { background-color: #ff9f43; }
        .btn-copy { background-color: #feca57; color: #574b1f; }
        .btn-excel { background-color: #1dd1a1; }
        .btn-save { background-color: #54a0ff; }
        .btn-load { background-color: #a29bfe; }

        #capture-calendar-area { background-color: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; box-sizing: border-box; margin: 0 auto; }
        .club-header h1 { margin: 0; font-size: 22px; color: #2c3e50; }
        .club-header p { margin: 5px 0 15px; font-size: 14px; color: #666; font-weight: bold; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .day-label { text-align: center; font-weight: bold; padding: 8px 0; background: #eee; border-radius: 4px; font-size: 12px; }
        .day-card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 5px; min-height: 100px; position: relative; overflow: hidden; }
        
        .anniversary { background-color: var(--anniversary-bg) !important; border: 1.5px solid #fbc02d !important; }
        .date-num { font-weight: bold; margin-bottom: 5px; display: block; border-bottom: 1px solid #f0f0f0; padding-bottom: 3px; font-size: 11px; }
        .holiday-name { font-size: 9px; margin-left: 2px; font-weight: normal; display: block; }
        .sun, .is-holiday { color: var(--holiday); } 
        .sat { color: #1e88e5; }
        
        .court-row { display: flex; gap: 2px; margin-bottom: 3px; align-items: center; }
        .time-label { font-size: 8px; width: 22px; color: #999; font-weight: bold; flex-shrink: 0; }
        .court-btn { flex: 1; height: 18px; border: none; border-radius: 3px; background-color: var(--available); cursor: pointer; font-size: 8px; color: white; padding: 0; }
        .court-btn.booked { background-color: var(--booked); color: #b71c1c; font-weight: bold; }

        /* 📱 모바일 화면 최적화 (가로 600px 이하) */
        @media screen and (max-width: 600px) {
            body { padding: 5px; }
            .current-month { font-size: 18px; min-width: 100px; }
            .action-btn { padding: 8px 10px; font-size: 11px; flex: 1 1 30%; } /* 버튼 3개씩 배치 */
            #capture-calendar-area { padding: 10px; }
            .day-card { min-height: 85px; padding: 3px; }
            .time-label { width: 18px; font-size: 7px; }
            .court-btn { height: 16px; font-size: 7px; }
            .date-num { font-size: 10px; }
        }

        /* 캡처용 임시 영역 */
        #capture-summary-temp { position: absolute; left: -9999px; top: 0; background: white; width: 450px; padding: 40px; border-radius: 20px; }
        .summary-item { margin-bottom: 12px; padding: 12px; border-radius: 10px; background: #f9f9f9; border-left: 5px solid #2196F3; }
        .summary-date { font-weight: bold; font-size: 17px; color: #333; margin-bottom: 4px; }
        .summary-detail { font-size: 15px; color: #555; line-height: 1.5; }

        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: white; padding: 20px; border-radius: 15px; width: 280px; text-align: center; }
        .modal input { width: 80%; padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; }
        .modal-buttons { display: flex; gap: 5px; }
        .m-btn { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; font-size: 13px; }
        .m-save { background: #2196F3; } .m-delete { background: #f44336; } .m-cancel { background: #7f8c8d; }
    </style>
</head>
<body>

<div class="header-container">
    <div class="nav-controls">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <span class="current-month" id="month-display"></span>
        <button class="nav-btn" onclick="changeMonth(1)">▶</button>
    </div>
    
    <div class="btn-group">
        <button class="action-btn btn-cal" onclick="captureCalendarImage()">📸 달력형</button>
        <button class="action-btn btn-list" onclick="captureSummaryImage()">📝 요약형</button>
        <button class="action-btn btn-copy" onclick="copyToClipboard()">📋 복사</button>
        <button class="action-btn btn-excel" onclick="downloadExcel()">📊 엑셀</button>
        <button class="action-btn btn-save" onclick="exportData()">💾 백업</button>
        <button class="action-btn btn-load" onclick="document.getElementById('fileInput').click()">📂 불러오기</button>
        <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
    </div>
</div>

<div id="capture-calendar-area">
    <div class="club-header" style="text-align: center;">
        <h1>한미모스 테니스 클럽</h1>
        <p class="sub-date-text"></p>
    </div>
    <div class="calendar-grid" id="calendar"></div>
</div>

<div id="capture-summary-temp">
    <div class="club-header">
        <h1>한미모스 테니스 클럽</h1>
        <p class="sub-date-text"></p>
    </div>
    <div id="summary-list-content"></div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h3 id="modal-title" style="margin:0">코트 예약</h3>
        <input type="text" id="modal-input" placeholder="이름 입력">
        <div class="modal-buttons" id="modal-btn-container"></div>
    </div>
</div>

<script>
    let currentYear = 2026;
    let currentMonth = 2; 
    let reservationData = JSON.parse(localStorage.getItem('tennisData')) || {};
    let currentVersion = parseInt(localStorage.getItem('backupVersion')) || 1;
    let activeKey = null;

    const timeSlots = ["08-10", "10-12", "12-14", "14-16", "16-18"];

    const lunarHolidays = {
        2025: { seollal: "1-29", chuseok: "10-6" },
        2026: { seollal: "2-17", chuseok: "9-25" },
        2027: { seollal: "2-7", chuseok: "9-15" },
        2028: { seollal: "1-27", chuseok: "10-3" },
        2029: { seollal: "2-13", chuseok: "9-22" },
        2030: { seollal: "2-3", chuseok: "9-12" }
    };

    function getHolidays(year) {
        let holidayList = {};
        const fixed = { "1-1":"신정", "3-1":"삼일절", "5-5":"어린이날", "6-6":"현충일", "8-15":"광복절", "10-3":"개천절", "10-9":"한글날", "12-25":"성탄절" };
        for (let key in fixed) {
            let [m, d] = key.split('-').map(Number);
            let date = new Date(year, m - 1, d);
            holidayList[`${m}-${d}`] = fixed[key];
            if ([3, 5, 8, 10, 12].includes(m)) {
                if (date.getDay() === 0 || date.getDay() === 6) {
                    let subDate = new Date(date);
                    subDate.setDate(date.getDate() + (date.getDay() === 0 ? 1 : 2));
                    holidayList[`${subDate.getMonth()+1}-${subDate.getDate()}`] = fixed[key] + " 대체공휴일";
                }
            }
        }
        const buddha = { 2025:"5-5", 2026:"5-24", 2027:"5-13", 2028:"5-2", 2029:"5-20", 2030:"5-9" };
        if(buddha[year]) holidayList[buddha[year]] = "부처님오신날";
        const lunar = lunarHolidays[year];
        if (lunar) {
            [ {d: lunar.seollal, n: "설날"}, {d: lunar.chuseok, n: "추석"} ].forEach(item => {
                let [m, d] = item.d.split('-').map(Number);
                let targetDate = new Date(year, m - 1, d);
                let hasSunday = false;
                [-1, 0, 1].forEach(offset => {
                    let d2 = new Date(targetDate);
                    d2.setDate(targetDate.getDate() + offset);
                    if (d2.getDay() === 0) hasSunday = true;
                    holidayList[`${d2.getMonth()+1}-${d2.getDate()}`] = (offset === 0) ? item.n : item.n + " 연휴";
                });
                if (hasSunday) {
                    let subDate = new Date(targetDate);
                    subDate.setDate(targetDate.getDate() + 2);
                    holidayList[`${subDate.getMonth()+1}-${subDate.getDate()}`] = item.n + " 대체공휴일";
                }
            });
        }
        holidayList["12-12"] = "한미모스 창립기념일 ★";
        return holidayList;
    }

    function renderCalendar() {
        const calendar = document.getElementById('calendar');
        document.getElementById('month-display').innerText = `${currentYear}. ${String(currentMonth).padStart(2, '0')}`;
        const currentHolidays = getHolidays(currentYear);
        const subTexts = document.querySelectorAll('.sub-date-text');
        subTexts.forEach(el => el.innerText = `신정교 ${currentMonth}월 일정`);
        calendar.innerHTML = ''; 
        ['일','월','화','수','목','금','토'].forEach((day, i) => {
            const div = document.createElement('div');
            div.className = `day-label ${i===0?'sun':i===6?'sat':''}`;
            div.innerText = day;
            calendar.appendChild(div);
        });
        const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        for (let i = 0; i < firstDay; i++) calendar.appendChild(document.createElement('div'));
        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(currentYear, currentMonth - 1, d);
            const card = document.createElement('div');
            card.className = 'day-card';
            const holidayKey = `${currentMonth}-${d}`;
            const holidayName = currentHolidays[holidayKey] || "";
            const isAnniversary = holidayKey === "12-12";
            if (isAnniversary) card.classList.add('anniversary');
            const dateClass = (dateObj.getDay() === 0 || (holidayName && !isAnniversary)) ? 'sun' : (dateObj.getDay() === 6 ? 'sat' : '');
            card.innerHTML = `<span class="date-num ${dateClass}">${d}일${holidayName ? `<span class="holiday-name">(${holidayName})</span>` : ''}</span>`;
            timeSlots.forEach(time => {
                const row = document.createElement('div');
                row.className = 'court-row';
                const start = time.split('-')[0];
                row.innerHTML = `<span class="time-label">${start}시</span>`;
                for (let c = 1; c <= 3; c++) {
                    const btn = document.createElement('button');
                    btn.className = 'court-btn';
                    const key = `${currentYear}-${currentMonth}-${d}-${start}-${c}`;
                    if (reservationData[key]) {
                        btn.innerText = reservationData[key];
                        btn.classList.add('booked');
                    } else { btn.innerText = `C${c}`; }
                    btn.onclick = () => openModal(key, !!reservationData[key]);
                    row.appendChild(btn);
                }
                card.appendChild(row);
            });
            calendar.appendChild(card);
        }
    }

    function downloadExcel() {
        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
        const headers = ["날짜", "요일"];
        timeSlots.forEach(t => {
            const start = t.split('-')[0];
            headers.push(`${start}시(C1)`, `${start}시(C2)`, `${start}시(C3)`);
        });
        const data = [headers];
        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(currentYear, currentMonth - 1, d);
            const row = [`${currentMonth}/${d}`, weekDays[dateObj.getDay()]];
            timeSlots.forEach(t => {
                const start = t.split('-')[0];
                for (let c = 1; c <= 3; c++) {
                    const key = `${currentYear}-${currentMonth}-${d}-${start}-${c}`;
                    row.push(reservationData[key] || "-");
                }
            });
            data.push(row);
        }
        const worksheet = XLSX.utils.aoa_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, `${currentMonth}월 일정`);
        XLSX.writeFile(workbook, `한미모스_일정_${currentYear}_${currentMonth}월.xlsx`);
    }

    function captureCalendarImage() {
        const target = document.getElementById('capture-calendar-area');
        html2canvas(target, { scale: 2 }).then(canvas => saveImage(canvas, `한미모스_달력_${currentMonth}월.png`));
    }
    function captureSummaryImage() {
        const prefix = `${currentYear}-${currentMonth}-`;
        const keys = Object.keys(reservationData).filter(k => k.startsWith(prefix)).sort((a,b) => {
            const pa = a.split('-').map(Number); const pb = b.split('-').map(Number);
            return pa[2] - pb[2] || pa[3] - pb[3];
        });
        if (keys.length === 0) return alert("예약이 없어요!");
        const content = document.getElementById('summary-list-content');
        content.innerHTML = "";
        const summary = {};
        keys.forEach(k => {
            const [y, m, d, t, c] = k.split('-');
            const dateStr = `${m}월 ${d}일`;
            const info = `• [${t.padStart(2, '0')}시] 코트 ${c} : ${reservationData[k]}`;
            if (!summary[dateStr]) summary[dateStr] = [];
            summary[dateStr].push(info);
        });
        for (const [date, details] of Object.entries(summary)) {
            const item = document.createElement('div');
            item.className = 'summary-item';
            item.innerHTML = `<div class="summary-date">${date}</div><div class="summary-detail">${details.join('<br>')}</div>`;
            content.appendChild(item);
        }
        const target = document.getElementById('capture-summary-temp');
        html2canvas(target, { scale: 2 }).then(canvas => saveImage(canvas, `한미모스_요약_${currentMonth}월.png`));
    }
    function saveImage(canvas, filename) {
        const link = document.createElement('a'); link.download = filename; link.href = canvas.toDataURL(); link.click();
    }
    function openModal(key, isBooked) {
        activeKey = key;
        const input = document.getElementById('modal-input');
        const container = document.getElementById('modal-btn-container');
        input.value = reservationData[key] || "";
        container.innerHTML = isBooked ? 
            `<button class="m-btn m-save" onclick="handleSave()">수정</button><button class="m-btn m-delete" onclick="handleDelete()">삭제</button><button class="m-btn m-cancel" onclick="closeModal()">취소</button>` :
            `<button class="m-btn m-save" onclick="handleSave()">등록</button><button class="m-btn m-cancel" onclick="closeModal()">취소</button>`;
        document.getElementById('modal-overlay').style.display = 'flex';
        input.focus();
    }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function handleSave() {
        const name = document.getElementById('modal-input').value.trim();
        if (name) { reservationData[activeKey] = name.substring(0, 2); save(); }
    }
    function handleDelete() { if(confirm("삭제할까?")) { delete reservationData[activeKey]; save(); } }
    function save() { localStorage.setItem('tennisData', JSON.stringify(reservationData)); closeModal(); renderCalendar(); }
    function changeMonth(diff) { currentMonth += diff; if (currentMonth > 12) { currentMonth = 1; currentYear++; } else if (currentMonth < 1) { currentMonth = 12; currentYear--; } renderCalendar(); }
    function exportData() {
        const now = new Date();
        const dateStr = `${String(now.getFullYear()).slice(-2)}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
        const fileName = `TB_backup_${dateStr}_v${String(currentVersion).padStart(2,'0')}.json`;
        const link = document.createElement('a');
        link.href = 'data:application/json;charset=utf-8,'+ encodeURIComponent(JSON.stringify(reservationData));
        link.download = fileName; link.click();
        currentVersion++; localStorage.setItem('backupVersion', currentVersion);
    }
    function importData(e) {
        const reader = new FileReader();
        reader.onload = (le) => { reservationData = JSON.parse(le.target.result); localStorage.setItem('tennisData', JSON.stringify(reservationData)); renderCalendar(); };
        reader.readAsText(e.target.files[0]);
    }
    function copyToClipboard() {
        const prefix = `${currentYear}-${currentMonth}-`;
        const keys = Object.keys(reservationData).filter(k => k.startsWith(prefix)).sort();
        if (keys.length === 0) return alert("예약이 없어!");
        let text = `🎾 한미모스 테니스 클럽 ${currentMonth}월 일정\n\n`;
        const summary = {};
        keys.forEach(k => {
            const [y, m, d, t, c] = k.split('-');
            const info = `${m}/${d} [${t.padStart(2, '0')}시]`;
            if (!summary[info]) summary[info] = { c: [], n: [] };
            summary[info].c.push(c); summary[info].n.push(reservationData[k]);
        });
        for (const [key, val] of Object.entries(summary)) { text += `${key} 코트${val.c.join(',')} : ${val.n.join(',')}\n`; }
        navigator.clipboard.writeText(text).then(() => alert("텍스트 복사 완료!"));
    }
    renderCalendar();
</script>

</body>
</html>
