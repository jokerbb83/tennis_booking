<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한미모스 테니스 클럽 관리</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --available: #81c784; --booked: #ef9a9a; --primary: #2c3e50; --holiday: #e53935; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f4f4; padding: 20px; color: #333; margin: 0; overflow-x: hidden; }
        
        /* 헤더 및 컨트롤 */
        .header-container { text-align: center; margin-bottom: 15px; }
        .nav-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
        .nav-btn { padding: 8px 15px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .current-month { font-size: 22px; font-weight: 800; min-width: 130px; }
        
        .btn-group { display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
        .action-btn { 
            padding: 10px 12px; color: white; border: none; border-radius: 8px; 
            cursor: pointer; font-weight: 700; font-size: 12px; transition: all 0.2s;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }
        .btn-cal { background-color: #ff5e57; } .btn-list { background-color: #ff9f43; }
        .btn-copy { background-color: #feca57; color: #574b1f; } .btn-excel { background-color: #1dd1a1; }
        .btn-save { background-color: #54a0ff; } .btn-load { background-color: #a29bfe; }

        /* 핏 최적화 달력 영역 */
        #capture-calendar-area { 
            background-color: #fff; padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            max-width: 100%; margin: 0 auto; box-sizing: border-box; 
        }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; }
        .day-label { text-align: center; font-weight: bold; padding: 8px 0; background: #f8f8f8; border-radius: 4px; font-size: 13px; }
        .day-card { background: #fff; border: 1px solid #eee; border-radius: 6px; padding: 4px; min-height: 120px; box-sizing: border-box; }
        
        .date-num { font-weight: bold; margin-bottom: 5px; display: block; border-bottom: 1px solid #f9f9f9; padding-bottom: 2px; font-size: 12px; }
        .sun { color: var(--holiday); } .sat { color: #1e88e5; }
        
        /* 코트 행 레이아웃 */
        .court-row { display: flex; gap: 2px; margin-bottom: 3px; align-items: center; width: 100%; }
        .time-label { font-size: 10px; width: 30px; color: #aaa; font-weight: bold; flex-shrink: 0; }
        .court-btn { flex: 1; height: 22px; border: none; border-radius: 3px; background-color: var(--available); cursor: pointer; font-size: 9px; color: white; font-weight: bold; min-width: 0; }
        .court-btn.booked { background-color: var(--booked); color: #b71c1c; }

        /* 📱 초강력 모바일 핏 최적화 (768px 이하) */
        @media screen and (max-width: 768px) {
            body { padding: 5px; }
            #capture-calendar-area { padding: 6px; border-radius: 8px; }
            .calendar-grid { gap: 1.5px; }
            .day-label { font-size: 10px; padding: 5px 0; }
            .day-card { min-height: 90px; padding: 2px; }
            .date-num { font-size: 10px; margin-bottom: 3px; }

            /* 시간 라벨 폭을 더 줄임 (숫자만 표시) */
            .time-label { width: 12px; font-size: 8px; margin-right: 1px; }
            .court-row { gap: 1px; }
            
            /* 모바일 전용: 버튼 안의 'C1' 등 텍스트 제거하여 핏 최적화 */
            .court-btn { 
                height: 16px; 
                font-size: 0; /* 평소엔 글자 숨김 */
            }
            /* 예약자가 있을 때만 글자 크기를 살려 이름 표시 */
            .court-btn.booked { 
                font-size: 7px; 
                color: #b71c1c; 
            }
        }
    </style>
</head>
<body>

<div class="header-container">
    <div class="nav-controls">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <span class="current-month" id="month-display"></span>
        <button class="nav-btn" onclick="changeMonth(1)">▶</button>
    </div>
    
    <div class="btn-group">
        <button class="action-btn btn-cal" onclick="captureCalendarImage()">📸 달력저장</button>
        <button class="action-btn btn-excel" onclick="downloadExcel()">📊 엑셀저장</button>
        <button class="action-btn btn-save" onclick="exportData()">💾 백업저장</button>
        <button class="action-btn btn-load" onclick="document.getElementById('fileInput').click()">📂 불러오기</button>
        <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
    </div>
</div>

<div id="capture-calendar-area">
    <div style="text-align: center; margin-bottom: 10px;">
        <h1 style="margin:0; font-size: 18px; color: #2c3e50;">한미모스 테니스 클럽</h1>
        <p class="sub-date-text" style="margin:3px 0 0; font-size: 12px; font-weight: bold; color: #7f8c8d;"></p>
    </div>
    <div class="calendar-grid" id="calendar"></div>
</div>

<script>
    let currentYear = 2026;
    let currentMonth = 2; 
    let reservationData = JSON.parse(localStorage.getItem('tennisData')) || {};
    const timeSlots = ["08-10", "10-12", "12-14", "14-16", "16-18"];

    function renderCalendar() {
        const calendar = document.getElementById('calendar');
        const isMobile = window.innerWidth <= 768;
        document.getElementById('month-display').innerText = `${currentYear}. ${String(currentMonth).padStart(2, '0')}`;
        document.querySelectorAll('.sub-date-text').forEach(el => el.innerText = `신정교 ${currentMonth}월 일정`);
        
        calendar.innerHTML = ''; 
        ['일','월','화','수','목','금','토'].forEach((day, i) => {
            const div = document.createElement('div');
            div.className = `day-label ${i===0?'sun':i===6?'sat':''}`;
            div.innerText = day;
            calendar.appendChild(div);
        });

        const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        for (let i = 0; i < firstDay; i++) calendar.appendChild(document.createElement('div'));

        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(currentYear, currentMonth - 1, d);
            const card = document.createElement('div');
            card.className = 'day-card';
            
            const dateClass = dateObj.getDay() === 0 ? 'sun' : (dateObj.getDay() === 6 ? 'sat' : '');
            card.innerHTML = `<span class="date-num ${dateClass}">${d}일</span>`;

            timeSlots.forEach(time => {
                const row = document.createElement('div');
                row.className = 'court-row';
                const start = time.split('-')[0];
                
                // 모바일에서는 '08', PC에서는 '08시'
                const displayTime = isMobile ? start : start + '시';
                row.innerHTML = `<span class="time-label">${displayTime}</span>`;

                for (let c = 1; c <= 3; c++) {
                    const btn = document.createElement('button');
                    btn.className = 'court-btn';
                    const key = `${currentYear}-${currentMonth}-${d}-${start}-${c}`;
                    
                    btn.innerText = reservationData[key] || `C${c}`;
                    if (reservationData[key]) btn.classList.add('booked');
                    
                    btn.onclick = () => {
                        const name = prompt("예약자 성함 (2글자):", reservationData[key] || "");
                        if (name !== null) {
                            if (name.trim() === "") delete reservationData[key];
                            else reservationData[key] = name.substring(0, 2);
                            localStorage.setItem('tennisData', JSON.stringify(reservationData));
                            renderCalendar();
                        }
                    };
                    row.appendChild(btn);
                }
                card.appendChild(row);
            });
            calendar.appendChild(card);
        }
    }

    function captureCalendarImage() {
        html2canvas(document.getElementById('capture-calendar-area'), { 
            scale: 2,
            useCORS: true
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `한미모스_달력_${currentMonth}월.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    function changeMonth(diff) {
        currentMonth += diff;
        if (currentMonth > 12) { currentMonth = 1; currentYear++; }
        else if (currentMonth < 1) { currentMonth = 12; currentYear--; }
        renderCalendar();
    }
    
    window.addEventListener('resize', renderCalendar);
    renderCalendar();
</script>

</body>
</html>
