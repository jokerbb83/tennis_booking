<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한미모스 테니스 클럽 관리</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --available: #81c784; --booked: #ef9a9a; --primary: #2c3e50; --holiday: #e53935; --anniversary-bg: #fff9c4; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f4f4; padding: 20px; color: #333; margin: 0; }
        
        /* 헤더 및 내비게이션 */
        .header-container { text-align: center; margin-bottom: 20px; }
        .nav-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .nav-btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; }
        .current-month { font-size: 26px; font-weight: 800; min-width: 160px; }
        
        /* 🌈 무지개 버튼 그룹 */
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .action-btn { 
            padding: 12px 18px; color: white; border: none; border-radius: 10px; 
            cursor: pointer; font-weight: 700; font-size: 14px; transition: all 0.2s;
            box-shadow: 0 3px 0 rgba(0,0,0,0.1);
        }
        .btn-cal { background-color: #ff5e57; } .btn-list { background-color: #ff9f43; }
        .btn-copy { background-color: #feca57; color: #574b1f; } .btn-excel { background-color: #1dd1a1; }
        .btn-save { background-color: #54a0ff; } .btn-load { background-color: #a29bfe; }

        /* 달력 메인 영역 */
        #capture-calendar-area { background-color: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 1400px; margin: 0 auto; box-sizing: border-box; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-label { text-align: center; font-weight: bold; padding: 12px; background: #eee; border-radius: 5px; font-size: 16px; }
        .day-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px; min-height: 150px; }
        
        .date-num { font-weight: bold; margin-bottom: 8px; display: block; border-bottom: 1px solid #f0f0f0; padding-bottom: 4px; font-size: 15px; }
        .sun { color: var(--holiday); } .sat { color: #1e88e5; }
        
        /* PC 버전 코트 행 */
        .court-row { display: flex; gap: 4px; margin-bottom: 4px; align-items: center; width: 100%; }
        .time-label { font-size: 11px; width: 35px; color: #999; font-weight: bold; flex-shrink: 0; }
        .court-btn { flex: 1; height: 26px; border: none; border-radius: 4px; background-color: var(--available); cursor: pointer; font-size: 10px; color: white; font-weight: bold; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .court-btn.booked { background-color: var(--booked); color: #b71c1c; }

        /* 📱 모바일 최적화 (가장 중요한 부분) */
        @media screen and (max-width: 768px) {
            body { padding: 5px; }
            .btn-group { gap: 4px; padding: 0 5px; }
            .action-btn { padding: 8px 5px; font-size: 10px; flex: 1 1 30%; border-radius: 6px; }

            #capture-calendar-area { padding: 8px; border-radius: 10px; }
            .calendar-grid { gap: 2px; }
            .day-label { padding: 6px 0; font-size: 10px; }
            .day-card { min-height: 110px; padding: 2px; border-radius: 4px; }
            .date-num { font-size: 10px; margin-bottom: 3px; padding-bottom: 2px; }
            
            /* 시간 텍스트 너비 대폭 축소 (숫자만) */
            .time-label { width: 12px; font-size: 8px; margin-right: 1px; }
            .court-row { gap: 1px; } /* 버튼 간격 최소화 */
            .court-btn { height: 18px; font-size: 7px; border-radius: 2px; }
        }

        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: white; padding: 20px; border-radius: 15px; width: 280px; text-align: center; }
    </style>
</head>
<body>

<div class="header-container">
    <div class="nav-controls">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <span class="current-month" id="month-display"></span>
        <button class="nav-btn" onclick="changeMonth(1)">▶</button>
    </div>
    
    <div class="btn-group">
        <button class="action-btn btn-cal" onclick="captureCalendarImage()">📸 달력형 저장</button>
        <button class="action-btn btn-list" onclick="captureSummaryImage()">📝 요약형 저장</button>
        <button class="action-btn btn-copy" onclick="copyToClipboard()">📋 텍스트 복사</button>
        <button class="action-btn btn-excel" onclick="downloadExcel()">📊 엑셀 저장</button>
        <button class="action-btn btn-save" onclick="exportData()">💾 백업 저장</button>
        <button class="action-btn btn-load" onclick="document.getElementById('fileInput').click()">📂 불러오기</button>
        <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
    </div>
</div>

<div id="capture-calendar-area">
    <div style="text-align: center;">
        <h1 style="margin:0; font-size: 22px;">한미모스 테니스 클럽</h1>
        <p class="sub-date-text" style="margin:5px 0 10px; font-weight: bold; font-size: 14px;"></p>
    </div>
    <div class="calendar-grid" id="calendar"></div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h3 id="modal-title" style="margin-top:0;">예약 관리</h3>
        <input type="text" id="modal-input" style="width:100%; padding:10px; margin-bottom:15px; box-sizing:border-box; border: 1px solid #ddd; border-radius: 5px;">
        <div style="display:flex; gap:5px;">
            <button onclick="handleSave()" style="flex:1; padding:10px; background:#2196F3; color:white; border:none; border-radius:5px; font-weight:bold;">저장</button>
            <button onclick="closeModal()" style="flex:1; padding:10px; background:#7f8c8d; color:white; border:none; border-radius:5px; font-weight:bold;">취소</button>
        </div>
    </div>
</div>

<script>
    let currentYear = 2026;
    let currentMonth = 2; 
    let reservationData = JSON.parse(localStorage.getItem('tennisData')) || {};
    const timeSlots = ["08-10", "10-12", "12-14", "14-16", "16-18"];

    function renderCalendar() {
        const calendar = document.getElementById('calendar');
        document.getElementById('month-display').innerText = `${currentYear}. ${String(currentMonth).padStart(2, '0')}`;
        document.querySelectorAll('.sub-date-text').forEach(el => el.innerText = `신정교 ${currentMonth}월 일정`);
        
        calendar.innerHTML = ''; 
        ['일','월','화','수','목','금','토'].forEach((day, i) => {
            const div = document.createElement('div');
            div.className = `day-label ${i===0?'sun':i===6?'sat':''}`;
            div.innerText = day;
            calendar.appendChild(div);
        });

        const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        const isMobile = window.innerWidth <= 768;

        for (let i = 0; i < firstDay; i++) calendar.appendChild(document.createElement('div'));

        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(currentYear, currentMonth - 1, d);
            const card = document.createElement('div');
            card.className = 'day-card';
            
            const dateClass = dateObj.getDay() === 0 ? 'sun' : (dateObj.getDay() === 6 ? 'sat' : '');
            card.innerHTML = `<span class="date-num ${dateClass}">${d}일</span>`;

            timeSlots.forEach(time => {
                const row = document.createElement('div');
                row.className = 'court-row';
                const start = time.split('-')[0];
                
                // 모바일 최적화: 숫자만 표시
                const timeText = isMobile ? start : start + '시';
                row.innerHTML = `<span class="time-label">${timeText}</span>`;

                for (let c = 1; c <= 3; c++) {
                    const btn = document.createElement('button');
                    btn.className = 'court-btn';
                    const key = `${currentYear}-${currentMonth}-${d}-${start}-${c}`;
                    btn.innerText = reservationData[key] || `C${c}`;
                    if (reservationData[key]) btn.classList.add('booked');
                    btn.onclick = () => openModal(key);
                    row.appendChild(btn);
                }
                card.appendChild(row);
            });
            calendar.appendChild(card);
        }
    }

    let activeKey = null;
    function openModal(key) {
        activeKey = key;
        document.getElementById('modal-input').value = reservationData[key] || "";
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('modal-input').focus();
    }
    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function handleSave() {
        const val = document.getElementById('modal-input').value.trim();
        if (val) reservationData[activeKey] = val.substring(0, 2);
        else delete reservationData[activeKey];
        localStorage.setItem('tennisData', JSON.stringify(reservationData));
        closeModal();
        renderCalendar();
    }

    function changeMonth(diff) { currentMonth += diff; if (currentMonth > 12) { currentMonth = 1; currentYear++; } else if (currentMonth < 1) { currentMonth = 12; currentYear--; } renderCalendar(); }
    
    // 윈도우 크기 감지해서 실시간 대응
    window.addEventListener('resize', renderCalendar);
    renderCalendar();

    // 나머지 헬퍼 함수들 (이미지 저장, 복사 등) 동일하게 유지 가능
    function captureCalendarImage() {
        html2canvas(document.getElementById('capture-calendar-area'), { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `한미모스_달력_${currentMonth}월.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
